<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master’s Burgers – Menú</title>
<style>
:root{--bg:#0b0b0b;--card:#161616;--red:#e32226;--txt:#fff;--mut:#b5b5b5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
header{text-align:center;padding:22px 16px 8px}
header img{width:70%;max-width:320px;border-radius:8px}
header p{color:var(--mut);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
h2{padding:22px 16px 10px;font-size:20px}
h2 span{background:var(--red);padding:3px 10px;border-radius:6px}
.list{display:grid;gap:16px;padding:0 16px;max-width:760px;margin:auto}
.card{background:var(--card);border-radius:18px;overflow:hidden;display:flex;animation:up .6s both}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.card img{width:42%;object-fit:cover;transition:transform .5s}
.card:hover img{transform:scale(1.06)}
.info{padding:14px;display:flex;flex-direction:column;flex:1;gap:6px}
.info h3{font-size:17px}.info p{color:var(--mut);font-size:13px;line-height:1.35;flex:1}
.row{display:flex;justify-content:space-between;align-items:center}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:var(--red);color:#fff;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;transition:transform .15s}.opt:active{transform:scale(.9)}.card{flex-wrap:nowrap}.card img{min-height:170px}
.price{font-weight:700;color:var(--red)}
button{font:inherit;border:0;cursor:pointer}
.add{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;font-size:22px;transition:transform .15s}
.add:active{transform:scale(.8) rotate(90deg)}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
.extras{padding:0 16px;max-width:760px;margin:auto;display:grid;gap:10px}
.ex{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex .add{width:34px;height:34px;font-size:20px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;font-weight:700;font-size:16px;transform:translateY(150%);transition:transform .4s cubic-bezier(.2,1.2,.3,1);max-width:736px;margin:auto}
#bar.show{transform:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.3s;z-index:5}
#ov.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1b1b1b;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);z-index:6;max-height:88vh;overflow:auto;max-width:760px;margin:auto}
#sheet.show{transform:none}
#sheet h3{margin-bottom:12px}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2c2c2c;font-size:14px;gap:8px}
.q{display:flex;align-items:center;gap:8px}.q button{background:#2c2c2c;color:#fff;width:28px;height:28px;border-radius:50%}
input,textarea{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#fff;font:inherit}
.tot{display:flex;justify-content:space-between;font-weight:700;margin:14px 0 4px}
.send{width:100%;margin-top:12px;background:#25d366;color:#04200e;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
.err{color:#ff6b6b;font-size:13px;margin-top:6px;min-height:16px}
</style></head><body>

const ALL=[...MENU.flatMap(x=>[{id:x.id+"-s",n:x.n+" (Sencilla)",p:x.s},{id:x.id+"-c",n:x.n+" (Combo)",p:x.c}]),...EXTRAS],cart={};
const $=s=>document.getElementById(s),m=p=>p==null?"Por confirmar":"$"+p;
$("list").innerHTML=MENU.map(x=>(x.g?`<h2 style="padding:14px 0 0"><span>${x.g}</span></h2>`:"")+`<div class="card"><img src="${x.i}" alt="${x.n}" style="${x.logo?"object-fit:contain;background:#000;padding:10px":""}"><div class="info"><h3>${x.n} <small style="color:var(--mut);font-weight:400">· ${x.w}</small></h3><p>${x.d}</p><div class="opts"><button class="opt" onclick="add('${x.id}-s',this)">Sencilla $${x.s} +</button><button class="opt" onclick="add('${x.id}-c',this)">Combo $${x.c} +</button></div></div></div>`).join("");
$("extras").innerHTML=EXTRAS.map(x=>`<div class="ex"><span>${x.n}</span><span class="price">${m(x.p)}</span><button class="add" onclick="add('${x.id}',this)">+</button></div>`).join("");
function add(id,b){cart[id]=(cart[id]||0)+1;b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");navigator.vibrate&&navigator.vibrate(15);upd()}
function chg(id,d){cart[id]+=d;if(cart[id]<=0)delete cart[id];upd()}
function calc(){let t=0,n=0,u=false;for(const id in cart){const x=ALL.find(a=>a.id===id);n+=cart[id];x.p==null?u=true:t+=x.p*cart[id]}return{t,n,u}}
function totTxt(c){return "$"+c.t+(c.u?" + por confirmar":"")}
function upd(){const c=calc();$("bar").classList.toggle("show",c.n>0);$("cnt").textContent=c.n+(c.n==1?" producto":" productos");$("btot").textContent=totTxt(c);
$("items").innerHTML=Object.keys(cart).map(id=>{const x=ALL.find(a=>a.id===id);return `<div class="it"><span>${x.n}</span><span class="q"><button onclick="chg('${id}',-1)">−</button>${cart[id]}<button onclick="chg('${id}',1)">+</button></span></div>`}).join("");$("tot").textContent=totTxt(c);if(!c.n)closeSheet()}
function openSheet(){$("ov").classList.add("show");$("sheet").classList.add("show")}
function closeSheet(){$("ov").classList.remove("show");$("sheet").classList.remove("show")}
function send(){const name=$("name").value.trim(),c=calc();if(!c.n)return;if(!name){$("err").textContent="Escribe tu nombre para enviar el pedido.";$("name").focus();return}$("err").textContent="";
let t=`🍔 *Nuevo pedido – Master’s*\n👤 Nombre: ${name}\n\n`;
for(const id in cart){const x=ALL.find(a=>a.id===id);t+=`• ${cart[id]} x ${x.n}${x.p!=null?" ($"+x.p*cart[id]+")":""}\n`}
t+=`\n💰 Total: ${totTxt(c)}`;const nt=$("notes").value.trim();if(nt)t+=`\n📝 Notas: ${nt}`;
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(t)}`,"_blank")}
